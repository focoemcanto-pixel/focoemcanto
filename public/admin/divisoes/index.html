<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mande Sua Divisão | Foco OS</title><style>*{box-sizing:border-box}body{margin:0;background:#06070b;color:#fff;font-family:Arial,sans-serif}.page{padding:28px 18px 70px}.shell{width:min(1240px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:end;gap:18px}.eyebrow{color:#39d39f;font-size:10px;letter-spacing:.14em;font-weight:900}.title{font-size:clamp(36px,5vw,62px);line-height:.95;letter-spacing:-.055em;margin:9px 0}.muted{color:#8f95a7}.btn{border:1px solid #ffffff19;background:#ffffff0e;color:#fff;border-radius:11px;padding:11px 14px;font-weight:800;text-decoration:none;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:25px 0}.stat,.card{background:#0d1018;border:1px solid #ffffff15;border-radius:17px}.stat{padding:16px}.stat span{display:block;color:#747b8c;font-size:9px;font-weight:900;text-transform:uppercase}.stat strong{display:block;font-size:27px;margin-top:7px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.filter.active{background:#9b5cff}.list{display:grid;gap:11px}.card{padding:19px;display:grid;grid-template-columns:1fr auto;gap:18px}.card h3{margin:0;font-size:19px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:11px 0}.pill{font-size:10px;padding:6px 8px;border-radius:99px;background:#ffffff0e;color:#b5bac7}.card p{color:#a4aabc;line-height:1.5;font-size:13px}.question{border-left:2px solid #39d39f;padding-left:12px}.actions{display:flex;flex-direction:column;gap:8px;min-width:160px}.actions select{background:#090b11;color:#fff;border:1px solid #ffffff19;border-radius:10px;padding:10px}.empty{text-align:center;padding:60px;color:#777f90}@media(max-width:760px){.top{align-items:stretch;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.card{grid-template-columns:1fr}.actions{flex-direction:row;flex-wrap:wrap}}</style></head><body><div class="page"><div class="shell"><header class="top"><div><span class="eyebrow">BANCO DE CASOS</span><h1 class="title">Mande Sua Divisão</h1><p class="muted">Envios, permissões e seleção editorial.</p></div><button class="btn" onclick="load()">Atualizar</button></header><section class="stats"><div class="stat"><span>Recebidos</span><strong id="total">—</strong></div><div class="stat"><span>Pré-seleção</span><strong id="shortlisted">—</strong></div><div class="stat"><span>Gravados</span><strong id="recorded">—</strong></div><div class="stat"><span>Publicados</span><strong id="published">—</strong></div></section><div class="filters" id="filters"></div><main class="list" id="list"><div class="empty">Carregando…</div></main></div></div>
<script>const labels={received:'Recebido',shortlisted:'Pré-selecionado',recorded:'Gravado',published:'Publicado',archived:'Arquivado'},cats={ministerio:'Ministério dividindo','segunda-voz':'Segunda voz',funcionou:'Divisão que funcionou','preciso-de-divisao':'Precisa de divisão'},shows={video:'Vídeo e áudio',blur:'Vídeo desfocado',audio:'Somente áudio'};let rows=[],filter='all';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function render(){$('total').textContent=rows.length;for(const s of ['shortlisted','recorded','published'])$(s).textContent=rows.filter(x=>x.status===s).length;$('filters').innerHTML=['all',...Object.keys(labels)].map(s=>`<button class="btn filter ${filter===s?'active':''}" onclick="filter='${s}';render()">${s==='all'?'Todos':labels[s]}</button>`).join('');const data=filter==='all'?rows:rows.filter(x=>x.status===filter);$('list').innerHTML=data.length?data.map(x=>`<article class="card"><div><h3>${esc(x.name)} · ${esc(x.song)}</h3><div class="meta"><span class="pill">${esc(cats[x.category])}</span><span class="pill">${esc(shows[x.appearance])}</span><span class="pill">${esc(x.city)}</span><span class="pill">${new Date(x.createdAt).toLocaleDateString('pt-BR')}</span></div><p><b>Versão:</b> ${esc(x.songVersion)} ${x.key?'· Tom '+esc(x.key):''}</p><p class="question">${esc(x.question)}</p><p><b>Contato:</b> ${esc(x.whatsapp)} ${x.instagram?'· '+esc(x.instagram):''} ${x.ministry?'· '+esc(x.ministry):''}</p><p><b>Permissões:</b> ${esc(shows[x.appearance])}${x.allowIdentification?' · identificação autorizada':' · anônimo'}${x.updatesOptIn?' · WhatsApp autorizado':''}</p></div><div class="actions"><a class="btn" href="/api/admin/divisoes/${encodeURIComponent(x.id)}" target="_blank">Abrir material</a><select onchange="updateStatus('${x.id}',this.value)">${Object.keys(labels).map(s=>`<option value="${s}" ${x.status===s?'selected':''}>${labels[s]}</option>`).join('')}</select><small class="muted">${esc(x.id)}</small></div></article>`).join(''):'<div class="empty">Nenhum envio nesta categoria.</div>'}async function load(){try{const r=await fetch('/api/admin/divisoes',{cache:'no-store'}),d=await r.json();if(r.status===401)return location.href='/admin/login/?next=/admin/divisoes/';if(!r.ok)throw Error(d.message);rows=d.rows||[];render()}catch(e){$('list').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}async function updateStatus(id,status){const r=await fetch('/api/admin/divisoes',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})});if(!r.ok)return alert('Falha ao atualizar');rows.find(x=>x.id===id).status=status;render()}load();</script></body></html>
