<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mande Sua Divisão | Central Editorial</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% -10%,#13302d 0,transparent 32%),#06080d;color:#f7f9fb;font-family:Inter,Arial,sans-serif}.page{padding:26px 18px 80px}.shell{width:min(1380px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:18px}.eyebrow{color:#39d5bd;font-size:10px;letter-spacing:.15em;font-weight:900}.title{font-size:clamp(34px,5vw,60px);line-height:.95;letter-spacing:-.055em;margin:8px 0}.muted{color:#8e97a8}.top-actions,.filters,.meta,.actions,.contacts{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #ffffff1b;background:#ffffff0d;color:#fff;border-radius:11px;padding:10px 13px;font-weight:800;text-decoration:none;cursor:pointer;font:inherit}.btn:hover{border-color:#39d5bd77}.btn.primary{background:#39d5bd;color:#05201c;border-color:#39d5bd}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:25px 0}.stat,.card,.toolbar{background:#0d111a;border:1px solid #ffffff14;border-radius:18px}.stat{padding:17px}.stat span{display:block;color:#737d8e;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.stat strong{display:block;font-size:29px;margin-top:7px}.toolbar{padding:15px;margin-bottom:18px;display:grid;grid-template-columns:2fr repeat(4,1fr);gap:9px}.toolbar input,.toolbar select,.card select,.notes textarea{width:100%;background:#070a10;color:#fff;border:1px solid #ffffff1c;border-radius:10px;padding:11px 12px;font:inherit;outline:0}.toolbar input:focus,.toolbar select:focus,.card select:focus,.notes textarea:focus{border-color:#39d5bd}.result-line{display:flex;justify-content:space-between;align-items:center;margin:16px 2px;color:#8e97a8;font-size:12px}.list{display:grid;gap:12px}.card{padding:20px;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:22px}.card.priority-high{border-color:#f0b44d66;box-shadow:inset 3px 0 #f0b44d}.card h3{margin:0;font-size:20px;letter-spacing:-.02em}.card p{color:#aab1c0;line-height:1.55;font-size:13px}.question{border-left:2px solid #39d5bd;padding:9px 0 9px 13px;background:#39d5bd08}.pill{font-size:10px;padding:6px 9px;border-radius:99px;background:#ffffff0e;color:#c0c6d1}.pill.source{color:#8ce5d7;background:#39d5bd12}.pill.high{color:#ffd486;background:#f0b44d16}.side{display:flex;flex-direction:column;gap:9px}.side label{font-size:10px;color:#7f8899;font-weight:850;text-transform:uppercase}.contacts a{font-size:11px;color:#91dfd4}.notes{grid-column:1/-1;border-top:1px solid #ffffff12;padding-top:14px;display:grid;grid-template-columns:1fr auto;gap:9px;align-items:end}.notes textarea{resize:vertical;min-height:70px}.empty{text-align:center;padding:70px;color:#778193}.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:22px;z-index:20}.modal.open{display:flex}.modal-card{width:min(1000px,100%);background:#0b0f17;border:1px solid #ffffff20;border-radius:18px;padding:14px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modal video,.modal audio{display:block;width:100%;max-height:75vh;background:#000;border-radius:11px}.toast{position:fixed;right:20px;bottom:20px;background:#143c35;border:1px solid #39d5bd66;padding:12px 16px;border-radius:11px;display:none}.toast.show{display:block}.empty strong{display:block;color:#fff;font-size:19px;margin-bottom:8px}@media(max-width:980px){.toolbar{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(2,1fr)}.card{grid-template-columns:1fr}.notes{grid-column:auto}}@media(max-width:600px){.top{align-items:stretch;flex-direction:column}.toolbar{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.page{padding:18px 11px 60px}.card{padding:16px}.notes{grid-template-columns:1fr}.top-actions .btn{flex:1;text-align:center}}
</style></head><body><div class="page"><div class="shell"><header class="top"><div><span class="eyebrow">CENTRAL EDITORIAL</span><h1 class="title">Mande Sua Divisão</h1><p class="muted">Triagem, análise e acompanhamento dos casos enviados.</p></div><div class="top-actions"><a class="btn" href="/admin/">Voltar ao Foco OS</a><button class="btn" onclick="exportCsv()">Exportar CSV</button><button class="btn primary" onclick="load()">Atualizar</button></div></header>
<section class="stats"><div class="stat"><span>Total recebido</span><strong id="total">—</strong></div><div class="stat"><span>Novos</span><strong id="received">—</strong></div><div class="stat"><span>Pré-seleção</span><strong id="shortlisted">—</strong></div><div class="stat"><span>Gravados</span><strong id="recorded">—</strong></div><div class="stat"><span>Publicados</span><strong id="published">—</strong></div></section>
<section class="toolbar"><input id="search" placeholder="Buscar nome, música, ministério, cidade ou protocolo" oninput="render()"><select id="statusFilter" onchange="render()"><option value="all">Todos os status</option><option value="received">Novos</option><option value="shortlisted">Pré-selecionados</option><option value="recorded">Gravados</option><option value="published">Publicados</option><option value="archived">Arquivados</option></select><select id="categoryFilter" onchange="render()"><option value="all">Todas as categorias</option><option value="ministerio">Ministério dividindo</option><option value="segunda-voz">Segunda voz</option><option value="funcionou">Divisão que funcionou</option><option value="preciso-de-divisao">Precisa de divisão</option></select><select id="appearanceFilter" onchange="render()"><option value="all">Qualquer exibição</option><option value="video">Vídeo e áudio</option><option value="blur">Vídeo desfocado</option><option value="audio">Somente áudio</option></select><select id="sourceFilter" onchange="render()"><option value="all">Arquivo ou link</option><option value="file">Arquivo enviado</option><option value="link">Link externo</option></select></section>
<div class="result-line"><span id="resultCount">Carregando...</span><button class="btn" onclick="clearFilters()">Limpar filtros</button></div><main class="list" id="list"><div class="empty">Carregando envios...</div></main></div></div>
<div class="modal" id="modal" onclick="if(event.target===this)closePreview()"><div class="modal-card"><div class="modal-head"><strong id="modalTitle">Visualização</strong><button class="btn" onclick="closePreview()">Fechar</button></div><div id="player"></div></div></div><div class="toast" id="toast"></div>
<script>
const labels={received:'Novo',shortlisted:'Pré-selecionado',recorded:'Gravado',published:'Publicado',archived:'Arquivado'},cats={ministerio:'Ministério dividindo','segunda-voz':'Segunda voz',funcionou:'Divisão que funcionou','preciso-de-divisao':'Precisa de divisão'},shows={video:'Vídeo e áudio',blur:'Vídeo desfocado',audio:'Somente áudio'},sources={file:'Arquivo',link:'Link'};let rows=[],visible=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),size=n=>n?`${(Number(n)/1048576).toFixed(1)} MB`:'—',date=v=>new Date(v).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
function filtered(){const q=$('search').value.trim().toLowerCase(),status=$('statusFilter').value,category=$('categoryFilter').value,appearance=$('appearanceFilter').value,source=$('sourceFilter').value;return rows.filter(x=>(status==='all'||x.status===status)&&(category==='all'||x.category===category)&&(appearance==='all'||x.appearance===appearance)&&(source==='all'||(x.materialType||'file')===source)&&(!q||[x.name,x.song,x.songVersion,x.ministry,x.city,x.instagram,x.id,x.question].some(v=>String(v||'').toLowerCase().includes(q)))).sort((a,b)=>(b.priority==='high')-(a.priority==='high')||String(b.createdAt).localeCompare(String(a.createdAt)))}
function render(){for(const s of ['received','shortlisted','recorded','published'])$(s).textContent=rows.filter(x=>x.status===s).length;$('total').textContent=rows.length;visible=filtered();$('resultCount').textContent=`${visible.length} ${visible.length===1?'caso encontrado':'casos encontrados'}`;$('list').innerHTML=visible.length?visible.map(x=>`<article class="card ${x.priority==='high'?'priority-high':''}"><div><h3>${esc(x.name)} · ${esc(x.song)}</h3><div class="meta"><span class="pill source">${esc(sources[x.materialType||'file'])}</span><span class="pill">${esc(cats[x.category]||x.category)}</span><span class="pill">${esc(shows[x.appearance]||x.appearance)}</span>${x.priority==='high'?'<span class="pill high">Prioridade alta</span>':''}<span class="pill">${esc(x.city)}</span><span class="pill">${date(x.createdAt)}</span></div><p><b>Versão:</b> ${esc(x.songVersion)} ${x.key?'· Tom '+esc(x.key):''} · ${esc(x.audioSource||'')}</p><p class="question"><b>Pedido de análise:</b><br>${esc(x.question)}</p><p><b>Material:</b> ${x.materialType==='link'?esc(x.materialUrl):`${esc(x.fileName)} · ${size(x.fileSize)}`}</p><p><b>Permissões:</b> ${esc(shows[x.appearance])}${x.allowIdentification?' · identificação autorizada':' · sem identificação'}${x.updatesOptIn?' · avisos por WhatsApp autorizados':''}</p><div class="contacts"><a href="https://wa.me/${esc(x.whatsapp)}" target="_blank">WhatsApp</a>${x.instagram?`<a href="https://instagram.com/${esc(x.instagram.replace('@',''))}" target="_blank">Instagram</a>`:''}${x.ministry?`<span class="muted">${esc(x.ministry)}</span>`:''}</div></div><aside class="side"><button class="btn primary" onclick="openMaterial('${x.id}')">${x.materialType==='link'?'Abrir link':'Visualizar material'}</button><label>Status</label><select onchange="update('${x.id}',{status:this.value})">${Object.keys(labels).map(s=>`<option value="${s}" ${x.status===s?'selected':''}>${labels[s]}</option>`).join('')}</select><label>Prioridade</label><select onchange="update('${x.id}',{priority:this.value})"><option value="normal" ${!x.priority||x.priority==='normal'?'selected':''}>Normal</option><option value="high" ${x.priority==='high'?'selected':''}>Alta</option><option value="low" ${x.priority==='low'?'selected':''}>Baixa</option></select><small class="muted">${esc(x.id)}</small></aside><div class="notes"><textarea id="notes-${x.id}" placeholder="Anotações internas: diagnóstico, ideia de conteúdo, pontos a comentar...">${esc(x.editorialNotes||'')}</textarea><button class="btn" onclick="saveNotes('${x.id}')">Salvar anotações</button></div></article>`).join(''):'<div class="empty"><strong>Nenhum caso encontrado</strong>Ajuste os filtros ou aguarde novos envios.</div>'}
async function load(){try{$('list').innerHTML='<div class="empty">Atualizando...</div>';const r=await fetch('/api/admin/divisoes',{cache:'no-store'}),d=await r.json();if(r.status===401)return location.href='/admin/login/?next=/admin/divisoes/';if(!r.ok)throw Error(d.message||'Falha ao carregar');rows=d.rows||[];render()}catch(e){$('list').innerHTML=`<div class="empty"><strong>Não foi possível carregar</strong>${esc(e.message)}</div>`}}
async function update(id,data){const r=await fetch('/api/admin/divisoes',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,...data})}),d=await r.json();if(!r.ok)return notify(d.message||'Falha ao atualizar');const i=rows.findIndex(x=>x.id===id);if(i>=0)rows[i]=d.row;notify('Atualização salva');render()}
function saveNotes(id){update(id,{editorialNotes:$(`notes-${id}`).value})}
function openMaterial(id){const x=rows.find(r=>r.id===id);if(!x)return;if(x.materialType==='link')return window.open(x.materialUrl,'_blank','noopener');$('modalTitle').textContent=`${x.name} · ${x.song}`;$('player').innerHTML=x.fileType&&x.fileType.startsWith('audio/')?`<audio controls autoplay src="/api/admin/divisoes/${encodeURIComponent(id)}"></audio>`:`<video controls autoplay playsinline src="/api/admin/divisoes/${encodeURIComponent(id)}"></video>`;$('modal').classList.add('open')}
function closePreview(){$('modal').classList.remove('open');$('player').innerHTML=''}function clearFilters(){$('search').value='';for(const id of ['statusFilter','categoryFilter','appearanceFilter','sourceFilter'])$(id).value='all';render()}function notify(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function exportCsv(){const cols=['id','createdAt','status','priority','name','whatsapp','instagram','ministry','city','category','song','songVersion','key','audioSource','question','materialType','materialUrl','fileName','fileSize','appearance','allowIdentification','editorialNotes'],csv=[cols.join(';'),...visible.map(x=>cols.map(c=>`"${String(x[c]??'').replaceAll('"','""')}"`).join(';'))].join('\n'),blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`mande-sua-divisao-${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(a.href)}
load();
</script></body></html>
