<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Closet Marketplace</title><style>*{box-sizing:border-box}body{margin:0;background:#f5efe6;color:#241d18;font:14px Arial,sans-serif}.wrap{max-width:1280px;margin:auto;padding:24px}.hero{background:#241d18;color:#fff;border-radius:24px;padding:24px}.hero span,.eyebrow{font-size:10px;letter-spacing:.18em;font-weight:900;color:#c7aa8d}.hero h1{font:38px Georgia,serif;margin:7px 0}.hero p{max-width:760px;color:#ddcfc2;line-height:1.55}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:18px}.metric{padding:14px;background:#ffffff12;border:1px solid #ffffff18;border-radius:16px}.metric strong{display:block;font:25px Georgia,serif}.metric small{opacity:.7}.tabs{display:flex;gap:7px;overflow:auto;margin:16px 0}.tabs button{border:1px solid #ddcfbf;background:#fffaf3;padding:10px 13px;border-radius:999px;font-weight:800;color:#665547}.tabs button.active{background:#241d18;color:#fff}.panel{background:#fffaf3;border:1px solid #dfd0c0;border-radius:22px;padding:18px;margin-top:12px}.panel h2{font:28px Georgia,serif;margin:5px 0 10px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{border:1px solid #dfd1c2;background:#fffdf8;border-radius:18px;padding:14px}.head{display:flex;justify-content:space-between;gap:10px}.head h3{font:21px Georgia,serif;margin:4px 0}.status{font-size:9px;font-weight:900;padding:6px 8px;border-radius:999px;background:#efe2d4;height:max-content}.ok{background:#dcebdc;color:#35633c}.warn{background:#f2e5ca;color:#866321}.bad{background:#f2d8d3;color:#8e4438}.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid #eee2d5}.row span{color:#79695d}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button,.primary{border:0;border-radius:12px;padding:10px 12px;font-weight:850}.primary{background:#241d18;color:#fff}.secondary{background:#ecdfd0;color:#4c3e34}.danger{background:#f2d8d3;color:#8e4438}.empty{text-align:center;padding:30px;border:1px dashed #d8c7b6;border-radius:18px;color:#756456}.toolbar{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}.toolbar input,.toolbar select,.modal input,.modal select,.modal textarea{border:1px solid #dbcdbd;background:#fff;border-radius:12px;padding:11px;min-width:0}.toolbar input{min-width:260px}.modalBack{position:fixed;inset:0;background:#1c150f88;display:none;place-items:center;z-index:99;padding:14px}.modalBack.open{display:grid}.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fffaf3;border-radius:24px;padding:18px}.modal h2{font:28px Georgia,serif}.form{display:grid;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px}.field span{font-size:9px;letter-spacing:.12em;font-weight:900;color:#8d735c}.field textarea{min-height:100px}.notice{padding:10px 12px;border-radius:12px;margin:10px 0;background:#e8efdf;color:#4b653e}.error{padding:10px 12px;border-radius:12px;margin:10px 0;background:#f2d8d3;color:#8e4438}.decision{display:grid;gap:7px}.case{border-left:4px solid #b08b66}.small{font-size:11px;color:#806f62;line-height:1.45}@media(max-width:800px){.wrap{padding:14px}.metrics{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.toolbar input{min-width:100%}}</style></head><body><main class="wrap"><section class="hero"><span>TRUST & COMMERCE</span><h1>Closet Marketplace</h1><p>Moderação de vendedores, lojas, catálogo, Proteção Closet e operação afiliada. Transações diretas permanecem separadas por feature flag.</p><div class="metrics"><div class="metric"><strong id="mSeller">–</strong><small>vendedores</small></div><div class="metric"><strong id="mVerify">–</strong><small>verificações</small></div><div class="metric"><strong id="mProduct">–</strong><small>produtos em análise</small></div><div class="metric"><strong id="mDispute">–</strong><small>contestações</small></div><div class="metric"><strong id="mAffiliate">–</strong><small>afiliados</small></div></div></section><div id="notice"></div><nav class="tabs" id="tabs"></nav><section id="content" class="panel"><div class="empty">Carregando Marketplace…</div></section></main><div class="modalBack" id="modal"><section class="modal" id="modalBody"></section></div><script>
let data=null,tab='sellers';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const status=s=>`<span class="status ${['active','verified','approved'].includes(s)?'ok':['rejected','suspended','restricted'].includes(s)?'bad':'warn'}">${esc(s)}</span>`;const tabs=[['sellers','Vendedores'],['verification','Verificações'],['stores','Lojas'],['products','Produtos'],['protection','Proteção Closet'],['affiliate','Afiliados'],['settings','Configurações']];
async function api(method='GET',body){const r=await fetch('/api/admin/closet-marketplace',{method,headers:body?{'Content-Type':'application/json'}:undefined,body:body?JSON.stringify(body):undefined,cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Falha no Marketplace');return d}function msg(text,bad=false){$('notice').innerHTML=text?`<div class="${bad?'error':'notice'}">${esc(text)}</div>`:''}async function load(){try{data=await api();$('mSeller').textContent=data.sellers.length;$('mVerify').textContent=data.verifications.length;$('mProduct').textContent=data.products.filter(x=>x.status==='review').length;$('mDispute').textContent=data.disputes.length;$('mAffiliate').textContent=data.affiliateProducts.length;render()}catch(e){msg(e.message,true)}}function renderTabs(){$('tabs').innerHTML=tabs.map(([id,label])=>`<button class="${tab===id?'active':''}" onclick="tab='${id}';render()">${label}</button>`).join('')}function render(){renderTabs();const c=$('content');if(!data)return;c.innerHTML=tab==='sellers'?renderSellers():tab==='verification'?renderVerification():tab==='stores'?renderStores():tab==='products'?renderProducts():tab==='protection'?renderProtection():tab==='affiliate'?renderAffiliate():renderSettings()}
function renderSellers(){return `<div class="toolbar"><div><span class="eyebrow">SELLERS</span><h2>Cadastro e risco</h2></div></div><div class="cards">${data.sellers.map(s=>`<article class="card"><div class="head"><div><small>${esc(s.entity_type)}</small><h3>${esc(s.display_name)}</h3></div>${status(s.status)}</div><div class="row"><span>Verificação</span><strong>${esc(s.verification_level)}</strong></div><div class="row"><span>Risco</span><strong>${esc(s.risk_status)}</strong></div><div class="actions"><button class="primary" onclick="act({action:'seller_activate',id:'${s.id}'},'Seller ativado')">Aprovar e ativar</button><button class="secondary" onclick="act({action:'seller_status',id:'${s.id}',status:'under_review'},'Em análise')">Em análise</button><button class="danger" onclick="act({action:'seller_status',id:'${s.id}',status:'suspended'},'Seller suspenso')">Suspender</button></div></article>`).join('')||'<div class="empty">Nenhum seller.</div>'}</div>`}
function renderVerification(){return `<span class="eyebrow">KYC / KYB</span><h2>Verificações pendentes</h2><div class="cards">${data.verifications.map(v=>{const s=data.sellers.find(x=>x.id===v.seller_id);return `<article class="card"><div class="head"><div><small>${esc(s?.display_name||'Seller')}</small><h3>${esc(v.verification_type)}</h3></div>${status(v.status)}</div><p class="small">${esc(v.reason||'Sem observações.')}</p><div class="actions"><button class="primary" onclick="act({action:'verification_decision',id:'${v.id}',status:'verified'},'Verificação aprovada')">Verificar</button><button class="danger" onclick="askReason('${v.id}')">Rejeitar</button></div></article>`}).join('')||'<div class="empty">Nada pendente.</div>'}</div>`}
function renderStores(){return `<span class="eyebrow">VITRINES</span><h2>Lojas</h2><div class="cards">${data.stores.map(s=>`<article class="card"><div class="head"><div><small>/loja/${esc(s.slug)}</small><h3>${esc(s.name)}</h3></div>${status(s.status)}</div><p>${esc(s.description||'Sem descrição.')}</p><div class="row"><span>Empresa verificada</span><strong>${s.verified_company?'Sim':'Não'}</strong></div><div class="actions"><button class="primary" onclick="act({action:'store_decision',id:'${s.id}',status:'active',verified_identity:true,verified_company:true},'Loja ativada')">Ativar verificada</button><button class="danger" onclick="act({action:'store_decision',id:'${s.id}',status:'restricted'},'Loja restrita')">Restringir</button></div></article>`).join('')||'<div class="empty">Nenhuma loja.</div>'}</div>`}
function renderProducts(){return `<span class="eyebrow">MODERAÇÃO</span><h2>Produtos seller</h2><div class="cards">${data.products.map(p=>`<article class="card"><div class="head"><div><small>${esc(p.category)}</small><h3>${esc(p.name)}</h3></div>${status(p.status)}</div><p>${esc(p.description||'Sem descrição.')}</p><div class="actions"><button class="primary" onclick="act({action:'product_decision',id:'${p.id}',status:'active'},'Produto publicado')">Aprovar</button><button class="danger" onclick="rejectProduct('${p.id}')">Rejeitar</button></div></article>`).join('')||'<div class="empty">Nenhum produto aguardando moderação.</div>'}</div>`}
function renderProtection(){return `<span class="eyebrow">PROTEÇÃO CLOSET</span><h2>Casos em andamento</h2><div class="cards">${data.disputes.map(d=>`<article class="card case"><div class="head"><div><small>${esc(d.reason_code)}</small><h3>${d.id.slice(0,8).toUpperCase()}</h3></div>${status(d.status)}</div><p>${esc(d.buyer_statement||'Sem relato textual.')}</p><div class="row"><span>Payout</span><strong>${d.payout_hold?'Bloqueado':'Liberado'}</strong></div><button class="primary" onclick="openCase('${d.id}')">Analisar evidências</button></article>`).join('')||'<div class="empty">Nenhuma contestação aberta.</div>'}</div>`}
function renderAffiliate(){return `<div class="toolbar"><div><span class="eyebrow">AFILIADOS</span><h2>SHEIN, Shopee e parceiros</h2></div><button class="primary" onclick="partnerModal()">Novo parceiro</button></div><div class="cards">${data.partners.map(p=>`<article class="card"><div class="head"><div><small>${esc(p.affiliate_network||'affiliate')}</small><h3>${esc(p.name)}</h3></div>${status(p.active?'active':'paused')}</div><div class="row"><span>Produtos</span><strong>${data.affiliateProducts.filter(x=>x.partner_id===p.id).length}</strong></div><button class="primary" onclick="productAffiliateModal('${p.id}')">Adicionar produto</button></article>`).join('')}</div>`}
function renderSettings(){const s=data.settings||{};return `<span class="eyebrow">POLÍTICAS</span><h2>Configurações operacionais</h2><div class="grid2"><label class="field"><span>PROTEÇÃO (DIAS)</span><input id="cfgProtection" value="${s.protection_window_days||30}"></label><label class="field"><span>DEVOLUÇÃO (DIAS)</span><input id="cfgReturn" value="${s.withdrawal_window_days||7}"></label><label class="field"><span>RESPOSTA SELLER (HORAS)</span><input id="cfgResponse" value="${s.seller_response_hours||48}"></label><label class="field"><span>HOLD SELLER NOVO (HORAS)</span><input id="cfgHold" value="${s.new_seller_payout_hold_hours||168}"></label><label class="field"><span>TRANSAÇÕES DIRETAS</span><select id="cfgTx"><option value="false" ${!s.transactions_enabled?'selected':''}>Desativadas</option><option value="true" ${s.transactions_enabled?'selected':''}>Ativadas</option></select></label><label class="field"><span>PROVEDOR PAGAMENTO</span><input id="cfgPay" value="${esc(s.payment_provider||'mercadopago')}"></label></div><div class="actions"><button class="primary" onclick="saveSettings()">Salvar políticas</button></div><p class="small">Não ative transações até gateway, termos jurídicos, webhooks, reembolso e conciliação estarem validados em produção.</p>`}
async function act(body,ok){try{await api('PATCH',body);msg(ok);await load()}catch(e){msg(e.message,true)}}function closeModal(){$('modal').classList.remove('open')}$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};
function askReason(id){$('modalBody').innerHTML=`<h2>Rejeitar verificação</h2><div class="form"><label class="field"><span>MOTIVO</span><textarea id="reason"></textarea></label><button class="danger" onclick="act({action:'verification_decision',id:'${id}',status:'rejected',reason:$('reason').value},'Verificação rejeitada');closeModal()">Confirmar rejeição</button></div>`;$('modal').classList.add('open')}
function rejectProduct(id){$('modalBody').innerHTML=`<h2>Rejeitar produto</h2><div class="form"><label class="field"><span>OBSERVAÇÃO PARA O SELLER</span><textarea id="notes"></textarea></label><button class="danger" onclick="act({action:'product_decision',id:'${id}',status:'rejected',notes:$('notes').value},'Produto rejeitado');closeModal()">Rejeitar</button></div>`;$('modal').classList.add('open')}
async function openCase(id){try{const r=await fetch('/api/admin/closet-marketplace?mode=dispute&id='+encodeURIComponent(id),{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.message);const ev=(d.evidence||[]).map(x=>`<div class="row"><span>${esc(x.evidence_type)} ${esc(x.caption||'')}</span><strong>${x.storage_path?'arquivo privado':x.external_url?'link externo':'evidência do sistema'}</strong></div>`).join('');$('modalBody').innerHTML=`<span class="eyebrow">CASO ${id.slice(0,8).toUpperCase()}</span><h2>${esc(d.dispute.reason_code)}</h2><p>${esc(d.dispute.buyer_statement||'')}</p><h3>Evidências</h3>${ev||'<div class="empty">Sem anexos.</div>'}<h3>Mensagens</h3>${(d.messages||[]).map(m=>`<div class="row"><span>${esc(m.author_role)}</span><strong>${esc(m.message)}</strong></div>`).join('')}<div class="divider"></div><div class="decision"><label class="field"><span>DECISÃO</span><select id="decision"><option value="return_full_refund">Devolução + reembolso</option><option value="full_refund_no_return">Reembolso sem devolução</option><option value="partial_refund">Reembolso parcial</option><option value="replacement">Troca/reposição</option><option value="missing_item_shipment">Enviar item faltante</option><option value="rejected">Recusar contestação</option><option value="escalated">Escalar investigação</option></select></label><label class="field"><span>VALOR (SE PARCIAL)</span><input id="amount" inputmode="decimal"></label><label class="field"><span>FUNDAMENTAÇÃO</span><textarea id="rationale"></textarea></label><button class="primary" onclick="decide('${id}')">Registrar decisão</button></div>`;$('modal').classList.add('open')}catch(e){msg(e.message,true)}}async function decide(id){await act({action:'dispute_decision',id,decision:$('decision').value,amount:$('amount').value||null,rationale:$('rationale').value},'Decisão registrada');closeModal()}
function partnerModal(){$('modalBody').innerHTML=`<h2>Novo parceiro afiliado</h2><div class="form"><label class="field"><span>NOME</span><input id="pn"></label><label class="field"><span>SLUG</span><input id="ps"></label><label class="field"><span>SITE</span><input id="pw"></label><label class="field"><span>REDE</span><input id="pr" value="affiliate"></label><button class="primary" onclick="act({action:'affiliate_partner',name:$('pn').value,slug:$('ps').value,website_url:$('pw').value,affiliate_network:$('pr').value},'Parceiro salvo');closeModal()">Salvar parceiro</button></div>`;$('modal').classList.add('open')}
function productAffiliateModal(partner){$('modalBody').innerHTML=`<h2>Produto afiliado</h2><div class="form"><label class="field"><span>NOME</span><input id="an"></label><div class="grid2"><label class="field"><span>CATEGORIA</span><input id="ac"></label><label class="field"><span>PREÇO</span><input id="ap"></label></div><label class="field"><span>IMAGEM</span><input id="ai"></label><label class="field"><span>LINK AFILIADO</span><input id="au"></label><label class="field"><span>TAGS</span><input id="at"></label><button class="primary" onclick="act({action:'affiliate_product',partner_id:'${partner}',name:$('an').value,category:$('ac').value,price:$('ap').value,image_url:$('ai').value,product_url:$('au').value,tags:$('at').value},'Produto afiliado adicionado');closeModal()">Adicionar</button></div>`;$('modal').classList.add('open')}
async function saveSettings(){await act({action:'settings',protection_window_days:Number($('cfgProtection').value),withdrawal_window_days:Number($('cfgReturn').value),seller_response_hours:Number($('cfgResponse').value),new_seller_payout_hold_hours:Number($('cfgHold').value),transactions_enabled:$('cfgTx').value==='true',payment_provider:$('cfgPay').value},'Políticas atualizadas')}
load();</script></body></html>
