<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produtos & Alunos | Foco OS</title><style>*{box-sizing:border-box}body{margin:0;background:#07080d;color:#fff;font-family:Inter,Arial,sans-serif}.page{width:min(1220px,calc(100% - 28px));margin:auto;padding:24px 0 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-size:20px;font-weight:950}.brand span{color:#a855f7}a{color:inherit;text-decoration:none}.btn{border:1px solid #292c38;background:#151721;color:#fff;padding:11px 14px;border-radius:12px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#a855f7,#7c3aed);border:0}.hero{padding:28px;border:1px solid #242633;background:linear-gradient(135deg,#12141e,#0c0d14);border-radius:26px;margin-bottom:16px}h1{font-size:42px;letter-spacing:-.05em;margin:6px 0}.muted{color:#9699a8}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.metric,.panel{border:1px solid #242633;background:#10121a;border-radius:18px;padding:18px}.metric span{display:block;color:#858999;font-size:11px;text-transform:uppercase;font-weight:900}.metric strong{display:block;font-size:28px;margin-top:8px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab.active{background:#6d28d9}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}input,select,textarea{background:#090a10;border:1px solid #292c38;color:#fff;padding:12px;border-radius:11px;font:inherit}input{flex:1;min-width:180px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #22242e;font-size:13px}th{color:#747887;font-size:10px;text-transform:uppercase}.badge{padding:5px 8px;border-radius:999px;background:#21172c;color:#d8b4fe;font-weight:900;font-size:10px}.empty{text-align:center;padding:35px;color:#777b8c}.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;padding:16px}.modal.open{display:grid}.box{width:min(680px,100%);background:#10121a;border:1px solid #2b2e3a;border-radius:22px;padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid>*{width:100%}.wide{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}@media(max-width:760px){.metrics{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.tableWrap{overflow:auto}h1{font-size:34px}}</style></head><body><main class="page"><div class="top"><div class="brand">FOCO <span>OS</span> · Produtos</div><a class="btn" href="/admin/">← Painel</a></div><section class="hero"><div class="muted">Catálogo, matrículas e receita</div><h1>Produtos & Alunos</h1><p class="muted">Cadastre seus produtos e acompanhe cada aluno, compra, valor e status de acesso.</p><div class="toolbar"><button class="btn primary" onclick="openProduct()">+ Novo produto</button><button class="btn" onclick="openEnrollment()">+ Nova matrícula</button></div></section><section class="metrics"><div class="metric"><span>Produtos</span><strong id="mProducts">0</strong></div><div class="metric"><span>Alunos ativos</span><strong id="mStudents">0</strong></div><div class="metric"><span>Receita</span><strong id="mRevenue">R$ 0</strong></div><div class="metric"><span>Ticket médio</span><strong id="mTicket">R$ 0</strong></div></section><section class="panel"><div class="tabs"><button id="tabProducts" class="btn tab active" onclick="showTab('products')">Produtos</button><button id="tabStudents" class="btn tab" onclick="showTab('students')">Alunos</button></div><div id="productsView"><div class="toolbar"><input id="searchProducts" placeholder="Buscar produto..." oninput="renderProducts()"></div><div class="tableWrap"><table><thead><tr><th>Produto</th><th>Preço</th><th>Status</th><th>Alunos</th><th>Receita</th><th></th></tr></thead><tbody id="productRows"></tbody></table></div></div><div id="studentsView" style="display:none"><div class="toolbar"><input id="searchStudents" placeholder="Buscar aluno, e-mail ou produto..." oninput="renderStudents()"><select id="studentStatus" onchange="renderStudents()"><option value="">Todos</option><option value="active">Ativo</option><option value="pending">Pendente</option><option value="cancelled">Cancelado</option></select></div><div class="tableWrap"><table><thead><tr><th>Aluno</th><th>Produto</th><th>Status</th><th>Compra</th><th>Valor</th><th>Origem</th><th></th></tr></thead><tbody id="studentRows"></tbody></table></div></div></section></main><div class="modal" id="modal"><form class="box" id="form" onsubmit="save(event)"><h2 id="modalTitle"></h2><input type="hidden" id="kind"><input type="hidden" id="id"><div id="productFields" class="grid"><input id="name" placeholder="Nome do produto"><input id="slug" placeholder="Slug interno"><input id="price" type="number" step="0.01" placeholder="Preço"><select id="productStatus"><option value="active">Ativo</option><option value="draft">Rascunho</option><option value="archived">Arquivado</option></select><textarea id="description" class="wide" rows="3" placeholder="Descrição"></textarea></div><div id="studentFields" class="grid"><input id="student" placeholder="Nome do aluno"><input id="email" placeholder="E-mail"><input id="phone" placeholder="WhatsApp"><select id="productId"></select><select id="status"><option value="active">Ativo</option><option value="pending">Pendente</option><option value="cancelled">Cancelado</option></select><input id="amount" type="number" step="0.01" placeholder="Valor pago"><input id="purchasedAt" type="date"><input id="source" placeholder="Origem"><textarea id="notes" class="wide" rows="3" placeholder="Observações"></textarea></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar</button></div></form></div><script>let products=[],enrollments=[];const $=id=>document.getElementById(id),money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){const r=await fetch('/api/products',{cache:'no-store'});if(r.status===401)return location.href='/admin/login/?next=/admin/products/';const d=await r.json();if(!r.ok)return alert(d.message);products=d.products||[];enrollments=d.enrollments||[];render()}function render(){const active=enrollments.filter(x=>x.status==='active'),rev=enrollments.reduce((a,x)=>a+Number(x.amount||0),0);$('mProducts').textContent=products.length;$('mStudents').textContent=active.length;$('mRevenue').textContent=money(rev);$('mTicket').textContent=money(enrollments.length?rev/enrollments.length:0);$('productId').innerHTML='<option value="">Selecione o produto</option>'+products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');renderProducts();renderStudents()}function renderProducts(){const q=$('searchProducts').value.toLowerCase(),list=products.filter(x=>JSON.stringify(x).toLowerCase().includes(q));$('productRows').innerHTML=list.length?list.map(p=>{const es=enrollments.filter(x=>x.productId===p.id),rev=es.reduce((a,x)=>a+Number(x.amount||0),0);return `<tr><td><b>${esc(p.name)}</b><br><span class="muted">${esc(p.description||p.slug||'')}</span></td><td>${money(p.price)}</td><td><span class="badge">${esc(p.status)}</span></td><td>${es.length}</td><td>${money(rev)}</td><td><button class="btn" onclick="editProduct('${p.id}')">Editar</button> <button class="btn" onclick="removeItem('product','${p.id}')">Excluir</button></td></tr>`}).join(''):'<tr><td colspan="6" class="empty">Nenhum produto cadastrado.</td></tr>'}function renderStudents(){const q=$('searchStudents').value.toLowerCase(),f=$('studentStatus').value,list=enrollments.filter(x=>(!f||x.status===f)&&JSON.stringify(x).toLowerCase().includes(q));$('studentRows').innerHTML=list.length?list.map(e=>{const p=products.find(x=>x.id===e.productId);return `<tr><td><b>${esc(e.student||'Sem nome')}</b><br><span class="muted">${esc(e.email||e.phone||'—')}</span></td><td>${esc(p?.name||'Produto removido')}</td><td><span class="badge">${esc(e.status)}</span></td><td>${esc(e.purchasedAt||'—')}</td><td>${money(e.amount)}</td><td>${esc(e.source||'—')}</td><td><button class="btn" onclick="editEnrollment('${e.id}')">Editar</button> <button class="btn" onclick="removeItem('enrollment','${e.id}')">Excluir</button></td></tr>`}).join(''):'<tr><td colspan="7" class="empty">Nenhum aluno encontrado.</td></tr>'}function showTab(tab){$('productsView').style.display=tab==='products'?'block':'none';$('studentsView').style.display=tab==='students'?'block':'none';$('tabProducts').classList.toggle('active',tab==='products');$('tabStudents').classList.toggle('active',tab==='students')}function baseModal(kind){$('modal').classList.add('open');$('kind').value=kind;$('id').value='';$('productFields').style.display=kind==='product'?'grid':'none';$('studentFields').style.display=kind==='enrollment'?'grid':'none'}function openProduct(){baseModal('product');$('modalTitle').textContent='Novo produto';['name','slug','price','description'].forEach(x=>$(x).value='');$('productStatus').value='active'}function openEnrollment(){if(!products.length)return alert('Cadastre um produto primeiro.');baseModal('enrollment');$('modalTitle').textContent='Nova matrícula';['student','email','phone','amount','source','notes'].forEach(x=>$(x).value='');$('productId').value='';$('status').value='active';$('purchasedAt').value=new Date().toISOString().slice(0,10)}function closeModal(){$('modal').classList.remove('open')}function editProduct(id){const p=products.find(x=>x.id===id);openProduct();$('modalTitle').textContent='Editar produto';$('id').value=id;['name','slug','price','description'].forEach(k=>$(k).value=p[k]??'');$('productStatus').value=p.status}function editEnrollment(id){const e=enrollments.find(x=>x.id===id);openEnrollment();$('modalTitle').textContent='Editar matrícula';$('id').value=id;['student','email','phone','productId','status','amount','purchasedAt','source','notes'].forEach(k=>$(k).value=e[k]??'')}async function save(ev){ev.preventDefault();const kind=$('kind').value,body={kind,id:$('id').value||undefined};(kind==='product'?['name','slug','price','description']:['student','email','phone','productId','status','amount','purchasedAt','source','notes']).forEach(k=>body[k]=$(k).value);if(kind==='product')body.status=$('productStatus').value;const r=await fetch('/api/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)return alert(d.message);closeModal();load()}async function removeItem(kind,id){if(!confirm('Excluir este registro?'))return;const r=await fetch('/api/products',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind,id})});if(!r.ok)return alert('Não foi possível excluir.');load()}load();</script></body></html>
