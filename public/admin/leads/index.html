<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM de Leads | Foco OS</title><style>*{box-sizing:border-box}body{margin:0;background:#07080d;color:#fff;font-family:Inter,Arial,sans-serif}.page{width:min(1200px,calc(100% - 28px));margin:auto;padding:24px 0 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-size:20px;font-weight:950}.brand span{color:#a855f7}a{color:inherit;text-decoration:none}.btn{border:1px solid #292c38;background:#151721;color:#fff;padding:11px 14px;border-radius:12px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#a855f7,#7c3aed);border:0}.hero{padding:28px;border:1px solid #242633;background:linear-gradient(135deg,#12141e,#0c0d14);border-radius:26px;margin-bottom:16px}h1{font-size:42px;letter-spacing:-.05em;margin:6px 0}.muted{color:#9699a8}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.metric,.panel{border:1px solid #242633;background:#10121a;border-radius:18px;padding:18px}.metric span{display:block;color:#858999;font-size:11px;text-transform:uppercase;font-weight:900}.metric strong{display:block;font-size:28px;margin-top:8px}.panel{margin-top:14px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}input,select,textarea{background:#090a10;border:1px solid #292c38;color:#fff;padding:12px;border-radius:11px;font:inherit}input{flex:1;min-width:190px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #22242e;font-size:13px}th{color:#747887;font-size:10px;text-transform:uppercase}.badge{padding:5px 8px;border-radius:999px;background:#21172c;color:#d8b4fe;font-weight:900;font-size:10px}.empty{text-align:center;padding:35px;color:#777b8c}.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;padding:16px}.modal.open{display:grid}.box{width:min(680px,100%);background:#10121a;border:1px solid #2b2e3a;border-radius:22px;padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid>*{width:100%}.wide{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}@media(max-width:760px){.metrics{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.tableWrap{overflow:auto}h1{font-size:34px}}</style></head><body><main class="page"><div class="top"><div class="brand">FOCO <span>OS</span> · CRM</div><a class="btn" href="/admin/">← Painel</a></div><section class="hero"><div class="muted">Jornada e relacionamento</div><h1>CRM de Leads</h1><p class="muted">Acompanhe origem, campanha, produto, estágio e valor de cada contato.</p><button class="btn primary" onclick="openModal()">+ Novo lead</button></section><section class="metrics"><div class="metric"><span>Total</span><strong id="mTotal">0</strong></div><div class="metric"><span>Clientes</span><strong id="mClients">0</strong></div><div class="metric"><span>Receita</span><strong id="mRevenue">R$ 0</strong></div><div class="metric"><span>Conversão</span><strong id="mConv">0%</strong></div></section><section class="panel"><div class="toolbar"><input id="search" placeholder="Buscar nome, e-mail, telefone, campanha..." oninput="render()"><select id="filter" onchange="render()"><option value="">Todos os status</option><option value="lead">Lead</option><option value="engajado">Engajado</option><option value="oferta">Oferta</option><option value="cliente">Cliente</option></select></div><div class="tableWrap"><table><thead><tr><th>Lead</th><th>Origem</th><th>Campanha</th><th>Produto</th><th>Status</th><th>Valor</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></main><div class="modal" id="modal"><form class="box" onsubmit="save(event)"><h2 id="modalTitle">Novo lead</h2><div class="grid"><input type="hidden" id="id"><input id="name" placeholder="Nome"><input id="email" placeholder="E-mail"><input id="phone" placeholder="WhatsApp"><input id="source" placeholder="Origem: Instagram, Grupo #2..."><input id="campaign" placeholder="Campanha / Live"><input id="product" placeholder="Produto"><select id="status"><option value="lead">Lead</option><option value="engajado">Engajado</option><option value="oferta">Oferta</option><option value="cliente">Cliente</option></select><input id="value" type="number" step="0.01" placeholder="Valor da compra"><textarea class="wide" id="notes" rows="3" placeholder="Observações"></textarea></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar lead</button></div></form></div><script>let leads=[];const $=id=>document.getElementById(id),money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){const r=await fetch('/api/leads',{cache:'no-store'});if(r.status===401)return location.href='/admin/login/?next=/admin/leads/';const d=await r.json();if(!r.ok)return alert(d.message);leads=d.leads||[];render()}function render(){const q=$('search').value.toLowerCase(),f=$('filter').value;const list=leads.filter(x=>(!f||x.status===f)&&JSON.stringify(x).toLowerCase().includes(q));$('rows').innerHTML=list.length?list.map(x=>`<tr><td><b>${esc(x.name||'Sem nome')}</b><br><span class="muted">${esc(x.email||x.phone||'—')}</span></td><td>${esc(x.source||'—')}</td><td>${esc(x.campaign||'—')}</td><td>${esc(x.product||'—')}</td><td><span class="badge">${esc(x.status)}</span></td><td>${money(x.value)}</td><td><button class="btn" onclick="edit('${x.id}')">Editar</button> <button class="btn" onclick="removeLead('${x.id}')">Excluir</button></td></tr>`).join(''):`<tr><td colspan="7" class="empty">Nenhum lead encontrado.</td></tr>`;const clients=leads.filter(x=>x.status==='cliente'),rev=clients.reduce((a,x)=>a+Number(x.value||0),0);$('mTotal').textContent=leads.length;$('mClients').textContent=clients.length;$('mRevenue').textContent=money(rev);$('mConv').textContent=leads.length?((clients.length/leads.length)*100).toFixed(1)+'%':'0%'}function openModal(){$('modal').classList.add('open');$('modalTitle').textContent='Novo lead';['id','name','email','phone','source','campaign','product','value','notes'].forEach(x=>$(x).value='');$('status').value='lead'}function closeModal(){$('modal').classList.remove('open')}function edit(id){const x=leads.find(v=>v.id===id);if(!x)return;openModal();$('modalTitle').textContent='Editar lead';['id','name','email','phone','source','campaign','product','status','value','notes'].forEach(k=>$(k).value=x[k]??'')}async function save(e){e.preventDefault();const body={};['id','name','email','phone','source','campaign','product','status','value','notes'].forEach(k=>body[k]=$(k).value);const r=await fetch('/api/leads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)return alert(d.message);closeModal();load()}async function removeLead(id){if(!confirm('Excluir este lead?'))return;const r=await fetch('/api/leads',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});if(!r.ok)return alert('Não foi possível excluir.');load()}load();</script></body></html>
