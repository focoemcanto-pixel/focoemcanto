<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Closet Seller Docs</title><style>*{box-sizing:border-box}body{margin:0;background:#f5efe6;color:#241d18;font:14px Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px}.hero{background:#251e18;color:#fff;border-radius:24px;padding:22px}.hero span{font-size:10px;letter-spacing:.18em;color:#c7aa8d;font-weight:900}.hero h1{font:36px Georgia,serif;margin:7px 0}.hero p{color:#ddcfc2}.toolbar{display:flex;gap:8px;justify-content:space-between;align-items:center;margin:14px 0;flex-wrap:wrap}.toolbar input,.toolbar select{border:1px solid #dbcdbd;border-radius:12px;padding:11px;background:#fffaf3}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:#fffaf3;border:1px solid #dfd1c2;border-radius:18px;padding:14px}.head{display:flex;justify-content:space-between;gap:10px}.head h3{font:21px Georgia,serif;margin:3px 0}.status{font-size:9px;font-weight:900;border-radius:999px;padding:6px 8px;background:#f2e5ca;color:#866321;height:max-content}.ok{background:#dcebdc;color:#35633c}.bad{background:#f2d8d3;color:#8e4438}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actions button{border:0;border-radius:12px;padding:10px 12px;font-weight:850}.primary{background:#251e18;color:white}.secondary{background:#eee1d1}.danger{background:#f2d8d3;color:#8e4438}.notice{margin:12px 0;padding:11px;border-radius:12px;background:#e8efdf;color:#4b653e}.error{margin:12px 0;padding:11px;border-radius:12px;background:#f2d8d3;color:#8e4438}.empty{text-align:center;padding:30px;border:1px dashed #d8c7b6;border-radius:18px}@media(max-width:720px){.wrap{padding:14px}.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><span>TRUST & SAFETY</span><h1>Documentos de sellers</h1><p>Revisão de documentos privados enviados para KYC/KYB do Marketplace Closet.</p></section><div id="msg"></div><div class="toolbar"><input id="q" placeholder="Buscar seller ou documento" oninput="render()"><select id="f" onchange="render()"><option value="all">Todos</option><option value="submitted">Enviados</option><option value="accepted">Aceitos</option><option value="rejected">Rejeitados</option></select><button class="primary" onclick="load()">Atualizar</button></div><section id="grid" class="grid"></section></main><script>let rows=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function msg(t,b=false){$('msg').innerHTML=t?`<div class="${b?'error':'notice'}">${esc(t)}</div>`:''}function cls(s){return s==='accepted'?'status ok':s==='rejected'?'status bad':'status'}async function api(method='GET',body){const r=await fetch('/api/admin/closet-seller-documents',{method,headers:body?{'Content-Type':'application/json'}:undefined,body:body?JSON.stringify(body):undefined,cache:'no-store'}),d=await r.json().catch(()=>({}));if(r.status===401){location.href='/admin/login/?next=/admin/closet-seller-documents/';throw Error('Sessão expirada.')}if(!r.ok)throw Error(d.message||'Falha');return d}async function load(){try{rows=(await api()).rows||[];render()}catch(e){msg(e.message,true)}}function render(){const q=$('q').value.trim().toLowerCase(),f=$('f').value,shown=rows.filter(x=>(f==='all'||x.status===f)&&(!q||`${x.seller?.display_name||''} ${x.document_type||''} ${x.original_filename||''}`.toLowerCase().includes(q)));$('grid').innerHTML=shown.length?shown.map(x=>`<article class="card"><div class="head"><div><small>${esc(x.document_type)}</small><h3>${esc(x.seller?.display_name||'Seller')}</h3></div><span class="${cls(x.status)}">${esc(x.status)}</span></div><p>${esc(x.original_filename||'Documento')}<br><small>${new Date(x.created_at).toLocaleString('pt-BR')}</small></p><div class="actions"><button class="primary" onclick="openDoc('${x.id}')">Abrir arquivo</button><button class="secondary" onclick="setStatus('${x.id}','accepted')">Aceitar</button><button class="danger" onclick="setStatus('${x.id}','rejected')">Rejeitar</button></div></article>`).join(''):'<div class="empty">Nenhum documento nesta visão.</div>'}async function openDoc(id){try{const d=await api('POST',{id});window.open(d.signed_url,'_blank','noopener,noreferrer')}catch(e){msg(e.message,true)}}async function setStatus(id,status){try{await api('POST',{id,action:'status',status});msg('Status atualizado.');await load()}catch(e){msg(e.message,true)}}load();</script></body></html>
